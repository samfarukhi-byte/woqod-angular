<div class="woqod-bulkfuel-wrapper">
  <div class="woqod-page-header woqod-page-header-tenders">
    <div class="container">
      <div class="row"><div class="col-12">
        <button class="woqod-back-btn" type="button" (click)="back()">← Back to Retail Services</button>
        <div class="woqod-header-content">
          <h1 class="woqod-page-title">{{ info.icon }} {{ info.name }}</h1>
          <p class="woqod-page-subtitle">{{ info.tagline }}</p>
        </div>
      </div></div>
    </div>
  </div>

  <div class="container csp-bf-form-wrap">
    <div class="csp-card">
      <div class="csp-card__body">
        <p class="csp-modal-message" style="font-size:15px;">{{ info.description }}</p>
        <div class="csp-bf-section-head" style="margin-top:24px;">
          <h3 class="csp-bf-section-title">What’s included</h3>
        </div>
        <div class="csp-service-grid">
          <div class="csp-service-chip" *ngFor="let f of info.features">
            <span class="csp-service-chip__icon">✓</span>{{ f }}
          </div>
        </div>
        <div class="csp-actions-row" style="justify-content:flex-start;">
          <button class="csp-btn csp-btn--primary" type="button" (click)="back()">← Back to Retail Services</button>
        </div>
      </div>
    </div>
  </div>
</div>
